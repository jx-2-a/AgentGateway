<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Gateway</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --dim: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #e3b341;
    --cyan: #39c5cf;
    --red: #f85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 14px; min-height: 100vh;
  }
  .mono { font-family: Consolas, "Courier New", monospace; }

  /* ---- 细滚动条 ---- */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
  * { scrollbar-width: thin; scrollbar-color: #30363d transparent; }

  /* ---- 头部 ---- */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    background: var(--card);
  }
  header .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 8px var(--green); }
  header h1 { font-size: 18px; font-weight: 600; }
  header .mode {
    margin-left: auto; padding: 4px 12px; border-radius: 12px;
    background: rgba(88,166,255,.15); color: var(--accent); font-size: 12px;
    border: 1px solid rgba(88,166,255,.3);
  }
  /* ---- 状态卡片 ---- */
  .cards {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    padding: 16px 20px 8px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px;
  }
  .card .label { color: var(--dim); font-size: 12px; text-transform: uppercase; }
  .card .value { font-size: 24px; font-weight: 600; margin-top: 4px; }
  .card .sub { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .card.cpu .value { color: var(--yellow); }
  .card.mem .value { color: var(--cyan); }
  .card.agents .value { color: var(--accent); }
  .card.sessions .value { color: var(--green); }

  /* ---- 主体网格 ---- */
  .panels {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    padding: 8px 20px;
  }
  .panel {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .panel h3 { padding: 12px 16px; font-size: 13px; color: var(--dim);
    border-bottom: 1px solid var(--border); }
  .panel h3.h3-btn { display: flex; align-items: center; gap: 8px; }
  .panel .body { flex: 1; overflow-y: auto; padding: 8px; }

  /* 本地Shell 按钮（与 mode 徽章同风格） */
  .shell-btn {
    margin-left: auto; padding: 4px 12px; border-radius: 6px;
    background: rgba(88,166,255,.12); color: var(--accent);
    border: 1px solid rgba(88,166,255,.35); cursor: pointer; font-size: 12px;
    white-space: nowrap;
  }
  .shell-btn:hover { background: rgba(88,166,255,.22); }

  /* ---- 列表 ---- */
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px; font-size: 13px;
  }
  .row:hover { background: rgba(255,255,255,.04); }
  .row .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .row .dot.on { background: var(--green); }
  .row .dot.off { background: var(--dim); }
  .row .dot.busy { background: var(--yellow); }
  .row .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .info { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .actions { margin-left: auto; display: flex; gap: 6px; flex-shrink: 0; }
  .row .mini-btn {
    background: transparent; color: var(--dim); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 4px; cursor: pointer; font-size: 12px;
    white-space: nowrap; min-width: 52px; text-align: center;
  }
  .row .mini-btn:hover { color: var(--text); border-color: var(--dim); }
  .row .mini-btn.primary:hover { color: var(--accent); border-color: var(--accent); }
  .row .mini-btn.danger:hover { color: var(--red); border-color: var(--red); }
  .empty { color: var(--dim); text-align: center; padding: 20px; font-size: 13px; }

  /* ---- Agent 分组（归拢） ---- */
  .group { padding: 6px 10px 0; }
  .group-head {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; margin-top: 6px;
    font-size: 12px; color: var(--dim); font-weight: 600;
    border-bottom: 1px solid var(--border);
  }
  .group-head:first-child { margin-top: 0; }
  .group-head .gcount { color: var(--dim); font-weight: 400; }
  .group-head .spacer { flex: 1; }
  .group-head .g-stop { cursor: pointer; color: var(--red); font-weight: 400; }
  .group-head .g-stop:hover { text-decoration: underline; }

  /* ---- 系统工具面板 ---- */
  .panel.tools { grid-column: 1 / -1; }
  .tools-body { padding: 8px 12px 4px; }
  .tool-sec { margin-bottom: 10px; }
  .tool-sec-head {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--dim); font-weight: 600; margin-bottom: 4px;
  }
  .tool-sec-head .spacer { flex: 1; }
  .tool-btn {
    padding: 2px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;
    background: transparent; color: var(--dim); border: 1px solid var(--border);
    white-space: nowrap;
  }
  .tool-btn:hover { color: var(--text); border-color: var(--dim); }
  .tool-btn.primary { color: var(--accent); border-color: rgba(88,166,255,.35); }
  .tool-btn.primary:hover { background: rgba(88,166,255,.12); }
  .tool-btn.danger { color: var(--red); border-color: rgba(248,81,73,.35); }
  .tool-btn.danger:hover { background: rgba(248,81,73,.1); }
  .tool-btn:disabled { opacity: .45; cursor: default; }
  .tool-sub { margin-top: 6px; }
  /* 通知提醒开关 */
  .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider { position: absolute; inset: 0; background: #30363d; border-radius: 999px; transition: .2s; }
  .switch .slider::before { content: ""; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px; background: #8b949e; border-radius: 50%; transition: .2s; }
  .switch input:checked + .slider { background: #238636; }
  .switch input:checked + .slider::before { transform: translateX(18px); background: #fff; }

  .trow { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 12px; min-width: 0; }
  .trow .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .trow .name { font-weight: 600; white-space: nowrap; }
  .trow .spacer { flex: 1; }
  .trow .note { font-size: 10px; color: var(--dim); border: 1px solid var(--border);
    border-radius: 8px; padding: 0 6px; white-space: nowrap; flex-shrink: 0; }
  .trow .meta { color: var(--dim); font-family: Consolas, monospace; font-size: 11px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ts-on { color: var(--green); }
  .ts-off { color: var(--dim); }
  .ts-state { font-size: 12px; font-weight: 600; }

  .tools .cmd-log {
    overflow-y: auto; padding: 6px 8px; margin-top: 2px; border-top: 1px dashed var(--border);
    font-family: Consolas, monospace; font-size: 11px; white-space: pre-wrap;
    word-break: break-all; color: var(--dim); max-height: 110px; min-height: 24px;
  }
  .tools .cmd-log .reply { color: var(--accent); }
  .tools .cmd-log .err { color: var(--red); }

  /* ---- 登录遮罩 ---- */
  #login-overlay {
    position: fixed; inset: 0; background: var(--bg); z-index: 100;
    display: flex; align-items: center; justify-content: center;
  }
  #login-overlay.hidden { display: none; }
  .login-box {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 30px; width: 320px; text-align: center;
  }
  .login-box h2 { margin-bottom: 6px; font-size: 18px; }
  .login-box p { color: var(--dim); font-size: 12px; margin-bottom: 18px; }
  .login-box input {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    font-family: Consolas, monospace; margin-bottom: 12px; outline: none;
  }
  .login-box input:focus { border-color: var(--accent); }
  .login-box button {
    width: 100%; padding: 10px; border: none; border-radius: 8px;
    background: var(--accent); color: #0d1117; font-weight: 600; cursor: pointer;
  }
  .login-box .err { color: var(--red); font-size: 12px; margin-top: 10px; min-height: 16px; }

  @media (max-width: 700px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .panels { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- 登录遮罩 -->
<div id="login-overlay">
  <div class="login-box">
    <h2>🔐 Agent Gateway</h2>
    <p>请输入访问令牌</p>
    <input type="password" id="token-input" placeholder="gateway token" autocomplete="off">
    <button id="login-btn">登 录</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<!-- 主面板 -->
<main id="dashboard" style="display:none">
  <header>
    <span class="dot"></span>
    <h1>Agent Gateway</h1>
    <span class="mode mono" id="mode-badge"></span>
  </header>

  <div class="cards">
    <div class="card cpu"><div class="label">CPU</div><div class="value" id="cpu-val">--%</div><div class="sub" id="cpu-sub"></div></div>
    <div class="card mem"><div class="label">Memory</div><div class="value" id="mem-val">--</div><div class="sub" id="mem-sub"></div></div>
    <div class="card agents"><div class="label">Agents</div><div class="value" id="agents-val">-</div><div class="sub">registered</div></div>
    <div class="card sessions"><div class="label">Sessions</div><div class="value" id="sessions-val">-</div><div class="sub" id="uptime-sub"></div></div>
  </div>

  <div class="panels">
    <div class="panel">
      <h3 class="h3-btn">Agents
        <button class="shell-btn" onclick="startAgent('shell')">🖥 本地Shell</button>
      </h3>
      <div class="body" id="agents-list"><div class="empty">加载中...</div></div>
    </div>
    <div class="panel">
      <h3>Sessions</h3>
      <div class="body" id="sessions-list"><div class="empty">加载中...</div></div>
    </div>
    <div class="panel tools">
      <h3>系统工具</h3>
      <div class="tools-body">
        <div class="tool-sec">
          <div class="tool-sec-head">通知提醒
            <span class="spacer"></span>
            <label class="switch"><input type="checkbox" id="notify-toggle" onchange="toggleNotify(this)"><span class="slider"></span></label>
          </div>
          <div class="trow"><span class="meta" id="notify-hint">关闭：不推送手机通知</span></div>
        </div>
        <div class="tool-sec">
          <div class="tool-sec-head">
            VPN
            <span id="ts-state" class="ts-state"></span>
            <span class="spacer"></span>
            <button class="tool-btn primary" id="ts-up">连接</button>
          </div>
          <div class="trow"><span class="dot" id="ts-dot"></span><span class="name">Tailscale</span><span class="note">局域网</span><span class="meta" id="ts-meta"></span></div>
          <div id="vpn-profiles"></div>
        </div>
        <div class="tool-sec">
          <div class="tool-sec-head">
            内存
            <span class="spacer"></span>
            <button class="tool-btn primary" id="memfree-btn">释放内存</button>
          </div>
          <div class="trow"><span class="name" id="mem-bar"></span><span class="meta" id="mem-detail"></span></div>
          <div class="trow" id="memfree-msg" style="display:none"></div>
        </div>
        <div class="tool-sec">
          <div class="tool-sec-head">运行中 Agent <span class="spacer"></span><span id="proc-count"></span></div>
          <div id="proc-list"></div>
        </div>
        <div class="tool-sec">
          <div class="tool-sec-head">本服务 (Gateway)
            <span class="spacer"></span>
            <button class="tool-btn" onclick="restartGateway()">重启</button>
            <button class="tool-btn danger" onclick="stopGateway()">停止服务</button>
          </div>
          <div id="self-info"></div>
        </div>
        <div class="cmd-log" id="cmd-log"></div>
      </div>
    </div>
  </div>
</main>

<script>
// ============================================================================
// 状态
// ============================================================================
let mode = { mode: 'gateway' };
let authed = false;
// agent_key -> 运行中 session 数（启动/归拢用）
let runningByAgent = {};
let sessionsCache = [];

// ============================================================================
// 工具
// ============================================================================
async function api(url, opts = {}) {
  const res = await fetch(url, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  if (res.status === 401 && !authed) {
    showLogin(); throw new Error('unauthorized');
  }
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail; } catch (e) {}
    throw new Error(detail);
  }
  return res.json();
}

function showLogin() { document.getElementById('login-overlay').classList.remove('hidden'); }
function hideLogin() { document.getElementById('login-overlay').classList.add('hidden'); }

function esc(s) {
  return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
function escAttr(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtSize(n) {
  if (n == null) return '';
  if (n < 1024) return n + 'B';
  if (n < 1024*1024) return (n/1024).toFixed(1) + 'K';
  return (n/1024/1024).toFixed(1) + 'M';
}
function cap(s) { s = String(s); return s.charAt(0).toUpperCase() + s.slice(1); }

// 终端页 URL（手机/桌面各自拿到正确的 host）
function termUrl(sessionId) {
  return location.origin + '/term?session=' + encodeURIComponent(sessionId);
}
function openTerminal(sessionId) {
  window.open(termUrl(sessionId), '_blank');
}
async function copyText(text, msg) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  cmdLog(msg || ('已复制: ' + text));
}
// 独立文件管理页（大区域 + 上传下载）
function openFilesPage(key) { window.open('/files?agent=' + encodeURIComponent(key), '_blank'); }
function cmdLog(text, cls) {
  const el = document.getElementById('cmd-log');
  const line = document.createElement('div');
  line.textContent = text;
  if (cls) line.className = cls;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

// ============================================================================
// Agents（卡片：复制链接 / 归拢 / 启动）
// ============================================================================
function renderAgents(agents) {
  const el = document.getElementById('agents-list');
  agents = agents.filter(a => !a.hidden);   // 隐藏项（如 shell）不展示
  if (!agents.length) { el.innerHTML = '<div class="empty">无已注册 Agent</div>'; return; }
  runningByAgent = {};
  agents.forEach(a => { runningByAgent[a.key] = a.running_count || 0; });

  el.innerHTML = agents.map(a => {
    const fileBtn = (a.file_roots && a.file_roots.length)
      ? `<button class="mini-btn" onclick="openFilesPage('${esc(a.key)}')">文件</button>` : '';
    return `<div class="row">
      <span class="dot ${a.is_online ? 'on' : 'off'}"></span>
      <span class="name">${esc(cap(a.key))}</span>
      <span class="info">${a.running_count ? '运行中 ' + a.running_count : ''}</span>
      <span class="actions">
        ${fileBtn}
        <button class="mini-btn" onclick="copyAgentLink('${esc(a.key)}')">复制链接</button>
        <button class="mini-btn primary" onclick="startAgent('${esc(a.key)}')">启动</button>
      </span>
    </div>`;
  }).join('');
}

// 复制该 agent 第一个运行中 session 的终端直链
function copyAgentLink(key) {
  const s = sessionsCache.find(x => x.agent_key === key && x.running && x.port);
  if (!s) { cmdLog(`[${key}] 没有运行中的会话可复制`, 'err'); return; }
  copyText(termUrl(s.id), `已复制 ${key} 终端链接`);
}

// ============================================================================
// Sessions（按 agent 归拢）
// ============================================================================
function renderSessions(sessions) {
  sessionsCache = sessions;
  const el = document.getElementById('sessions-list');
  if (!sessions.length) { el.innerHTML = '<div class="empty">无会话</div>'; return; }

  // 按 agent 分组，保持 agent 顺序与 Agents 面板一致
  const groups = {};
  sessions.forEach(s => {
    (groups[s.agent_key || s.agent] = groups[s.agent_key || s.agent] || []).push(s);
  });

  let html = '';
  for (const [key, list] of Object.entries(groups)) {
    const anyRunning = list.some(s => s.running);
    html += `<div class="group"><div class="group-head">` +
      `<span class="dot ${anyRunning ? 'on' : 'off'}"></span>` +
      `${esc(cap(key))}<span class="gcount">${list.length}</span>` +
      `<span class="spacer"></span>` +
      (anyRunning ? `<span class="g-stop" onclick="stopAgentGroup('${esc(key)}')">全部停止</span>` : '') +
      `</div>`;
    html += list.map(s => {
      const running = s.running;
      const actions = running
        ? `<button class="mini-btn primary" onclick="openTerminal('${esc(s.id)}')">终端</button>` +
          `<button class="mini-btn" onclick="copySessionLink('${esc(s.id)}')">复制</button>` +
          `<button class="mini-btn danger" onclick="stopSession('${esc(s.id)}')">停止</button>`
        : `<button class="mini-btn primary" onclick="openTerminal('${esc(s.id)}')">查看</button>` +
          `<button class="mini-btn" onclick="copySessionLink('${esc(s.id)}')">复制</button>` +
          `<button class="mini-btn danger" onclick="deleteSession('${esc(s.id)}')">删除</button>`;
      const pidStr = s.port ? ' :' + s.port : '';
      const exitStr = s.exit_code != null ? ' · exit ' + esc(String(s.exit_code)) : '';
      return `<div class="row">
        <span class="dot ${running ? 'on' : 'off'}"></span>
        <span class="name">${esc(cap(s.agent_key))}</span>
        <span class="info">#${esc(s.id)} · ${esc(s.status)}${pidStr}${exitStr}</span>
        <span class="actions">${actions}</span>
      </div>`;
    }).join('');
    html += `</div>`;
  }
  el.innerHTML = html;
}

function copySessionLink(id) {
  const s = sessionsCache.find(x => x.id === id);
  copyText(termUrl(id), s ? '已复制 ' + cap(s.agent_key) + ' #' + s.id + ' 终端链接' : '已复制链接');
}

async function stopAgentGroup(key) {
  const list = sessionsCache.filter(s => s.agent_key === key && s.running);
  for (const s of list) {
    try { await api('/api/sessions/' + encodeURIComponent(s.id) + '/stop', { method: 'POST' }); }
    catch (e) { cmdLog('[错误] ' + e.message, 'err'); }
  }
  cmdLog('⏹ 已停止 ' + key + ' 的 ' + list.length + ' 个会话');
  refreshSessions();
}

// ============================================================================
// 会话操作
// ============================================================================
async function startAgent(key) {
  cmdLog('🚀 启动 ' + key + ' ...');
  let s;
  try {
    s = await api('/api/sessions', {
      method: 'POST', body: JSON.stringify({ agent_name: key }),
    });
  } catch (e) { cmdLog('[错误] ' + e.message, 'err'); return; }
  if (s.status === 'error') {
    cmdLog('[错误] Agent 启动失败: ' + (s.error || '未知错误'), 'err');
  } else {
    cmdLog('✅ 已创建 Session: ' + s.id + ' (端口 ' + (s.port || '?') + ')');
    if (s.port) openTerminal(s.id);   // 直接打开终端页
  }
  refreshAll();
}

async function stopSession(id) {
  try {
    await api('/api/sessions/' + encodeURIComponent(id) + '/stop', { method: 'POST' });
    cmdLog('⏹ 已停止 Session: ' + id);
    refreshAll();
  } catch (e) { cmdLog('[错误] ' + e.message, 'err'); }
}

async function deleteSession(id) {
  try {
    await api('/api/sessions/' + encodeURIComponent(id), { method: 'DELETE' });
    cmdLog('🗑 已删除 Session: ' + id);
    refreshAll();
  } catch (e) { cmdLog('[错误] ' + e.message, 'err'); }
}

// ============================================================================
// 系统工具卡片（VPN/Tailscale、内存释放、设备、本服务）
// ============================================================================
function fmtUptime(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  return h ? h + 'h ' + m + 'm' : (m || 1) + 'm';
}

function renderTools(d) {
  // ---- Tailscale ----
  const ts = d.tailscale || {};
  const st = document.getElementById('ts-state');
  const dot = document.getElementById('ts-dot');
  const meta = document.getElementById('ts-meta');
  const upBtn = document.getElementById('ts-up');
  if (ts.available) {
    const on = !!ts.online;
    st.textContent = on ? '● 已连接' : '○ 未连接';
    st.className = 'ts-state ' + (on ? 'ts-on' : 'ts-off');
    dot.className = 'dot ' + (on ? 'on' : 'off');
    meta.textContent = on
      ? (ts.hostname + ' · ' + (ts.self_ip || '') + (ts.exit_node ? ' · exit→' + ts.exit_node.hostname : ''))
      : (ts.state === 'Stopped' ? 'Tailscale 已停止' : (ts.state || '未连接'));
    upBtn.disabled = on;   // 已连接时置灰，仅断开时可用
  } else {
    st.textContent = 'CLI 未安装';
    st.className = 'ts-state ts-off';
    meta.textContent = ts.reason || '';
    upBtn.disabled = true;
  }

  // ---- Windows 内置 VPN（学校等，可连接/断开） ----
  const profiles = d.vpn_profiles || [];
  document.getElementById('vpn-profiles').innerHTML = profiles.length
    ? '<div class="tool-sec-head tool-sub">内置 VPN</div>' + profiles.map(p => `
        <div class="trow">
          <span class="dot ${p.connected ? 'on' : 'off'}"></span>
          <span class="name">${esc(p.name)}</span>
          <span class="meta">${esc(p.server + (p.connected ? ' · 已连接' : ' · 未连接'))}</span>
          <span class="spacer"></span>
          <button class="tool-btn ${p.connected ? 'danger' : 'primary'}"
            onclick="vpnAction('${escAttr(p.name)}', ${p.connected ? 'false' : 'true'})">${p.connected ? '断开' : '连接'}</button>
        </div>`).join('')
    : '';

  // ---- 内存 ----
  const m = d.mem || {};
  document.getElementById('mem-bar').textContent =
    '已用 ' + m.used_gb + ' G / ' + m.total_gb + ' G (' + Math.round(m.percent || 0) + '%)';
  document.getElementById('mem-detail').textContent = '可用 ' + m.avail_gb + ' G';

  // ---- 运行中 Agent 进程资源 ----
  const procs = d.processes || [];
  document.getElementById('proc-count').textContent = procs.length ? procs.length + ' 个' : '';
  document.getElementById('proc-list').innerHTML = procs.length
    ? procs.map(p => `
        <div class="trow">
          <span class="dot on"></span>
          <span class="name">${esc(cap(p.agent_key))}</span>
          <span class="meta">#${esc(p.session_id)} · :${p.port} · ${p.cpu_percent}% · ${p.mem_mb} MB</span>
        </div>`).join('')
    : '<div class="trow"><span class="meta">（无运行中会话）</span></div>';

  // ---- 本服务 ----
  const g = d.gateway || {};
  _gwPid = g.pid || null;  // 停止服务的二次确认要用
  document.getElementById('self-info').innerHTML = `
    <div class="trow"><span class="name">PID ${g.pid || '-'}</span>
      <span class="meta">${fmtUptime(g.uptime_sec || 0)} · ${g.mem_mb} MB · ${esc(g.hostname || '')} · Py${esc(g.python || '')}</span></div>`;

  // ---- 通知提醒开关 ----
  const notifyEl = document.getElementById('notify-toggle');
  if (notifyEl.checked !== !!d.notifications_enabled) notifyEl.checked = !!d.notifications_enabled;
  updateNotifyHint(notifyEl.checked);
}

async function refreshTools() {
  try {
    const d = await api('/api/system');
    renderTools(d);
  } catch (e) {}
}

// 通知主开关：关闭一律不推；开启后"手机不在终端页前台"才推
function updateNotifyHint(on) {
  document.getElementById('notify-hint').textContent = on
    ? '开启：手机不在终端页 / 切后台时，agent 停下等你 → 响铃推送'
    : '关闭：不推送手机通知';
}
async function toggleNotify(el) {
  try {
    const r = await api('/api/system/notify', {
      method: 'POST',
      body: JSON.stringify({ enabled: el.checked }),
    });
    cmdLog(r.enabled ? '🔔 通知已开启' : '🔕 通知已关闭');
    updateNotifyHint(r.enabled);
  } catch (e) {
    cmdLog('[错误] ' + e.message, 'err');
    el.checked = !el.checked;
  }
}

// 当前网关 PID（renderTools 更新），停止服务的二次确认要用
let _gwPid = null;

// 停止网关服务：二次确认（先 confirm，再输入 PID 或「停止」，防误触）
async function stopGateway() {
  if (!_gwPid) return cmdLog('[错误] 拿不到网关 PID，无法确认', 'err');
  if (!confirm('⚠ 确定停止网关服务？\n所有 Agent 会话与手机推送都会停，需重新运行 start.bat 启动。')) return;
  const ans = (prompt('二次确认：输入网关 PID ' + _gwPid + '，或输入「停止」') || '').trim();
  if (!ans) return;
  if (ans !== String(_gwPid) && ans !== '停止') {
    cmdLog('⏹ 已取消：确认输入不匹配', 'err');
    return;
  }
  cmdLog('⏹ 正在停止网关 ...');
  try {
    const r = await api('/api/system/gateway/stop', { method: 'POST' });
    cmdLog('✅ 网关已停止 (PID ' + r.pid + ')，可关闭本页面', 'err');
  } catch (e) {
    // 网关自杀后请求/轮询会断开，这里成功或失败都算已停
    cmdLog('✅ 网关已停止', 'err');
  }
}

// 重启网关：一次确认（服务会自己回来，误触代价小）
async function restartGateway() {
  if (!confirm('确定重启网关服务？\n所有 Agent 会话会终止，约 5 秒后服务恢复。')) return;
  cmdLog('🔄 正在重启网关 ...');
  try {
    const r = await api('/api/system/gateway/restart', { method: 'POST' });
    cmdLog('✅ ' + (r.note || '网关重启中'), 'err');
  } catch (e) {
    cmdLog('[错误] 重启失败: ' + e.message, 'err');
  }
}

async function doTailscale() {
  const upBtn = document.getElementById('ts-up');
  upBtn.disabled = true;
  cmdLog('🚀 连接 Tailscale ...');
  try {
    const r = await api('/api/system/tailscale/up', { method: 'POST' });
    if (r.ok) cmdLog('✅ tailscale 连接成功');
    else cmdLog('[错误] tailscale 连接失败: ' + r.detail, 'err');
  } catch (e) { cmdLog('[错误] ' + e.message, 'err'); }
  upBtn.disabled = false;
  refreshTools();
}

// 连接/断开 Windows 内置 VPN（无需管理员）
async function vpnAction(name, connect) {
  cmdLog((connect ? '🚀 连接' : '⏹ 断开') + ' VPN ' + name + ' ...');
  try {
    const r = await api('/api/system/vpn', {
      method: 'POST',
      body: JSON.stringify({ name, action: connect ? 'connect' : 'disconnect' }),
    });
    if (r.ok) cmdLog('✅ ' + r.detail);
    else cmdLog('[错误] ' + (r.detail || '操作失败'), 'err');
  } catch (e) { cmdLog('[错误] ' + e.message, 'err'); }
  refreshTools();
}

// ============================================================================
// 状态卡片 + 图表
// ============================================================================
function updateCards(s) {
  document.getElementById('cpu-val').textContent = Math.round(s.cpu_percent) + '%';
  document.getElementById('mem-val').textContent = s.memory_used_gb + 'G';
  document.getElementById('mem-sub').textContent = '共 ' + s.memory_total_gb + 'GB (' + Math.round(s.memory_used_gb / s.memory_total_gb * 100) + '%)';
  document.getElementById('agents-val').textContent = s.agent_count;
  document.getElementById('sessions-val').textContent = s.session_count;
  document.getElementById('uptime-sub').textContent = 'boot ' + s.boot_time;
}

function modeText(m) {
  if (m.mode === 'shell') return 'Shell Mode';
  if (m.mode === 'attached') return 'Attached: ' + m.session_id;
  return '';
}

function updateModeBadge() {
  const el = document.getElementById('mode-badge');
  const t = modeText(mode);
  el.textContent = t;
  el.hidden = !t;
}

async function refreshStatus() {
  try {
    const s = await api('/api/status');
    mode = s.mode;
    updateModeBadge();
    updateCards(s);
  } catch (e) {}
}

async function refreshSessions() {
  try {
    const s = await api('/api/sessions');
    renderSessions(s);
  } catch (e) {}
}

async function refreshAgents() {
  try {
    const a = await api('/api/agents');
    renderAgents(a);
  } catch (e) {}
}

async function refreshAll() {
  await Promise.all([refreshStatus(), refreshSessions(), refreshAgents(), refreshTools()]);
}

// ============================================================================
// 初始化
// ============================================================================
async function init() {
  try {
    await api('/api/status');
  } catch (e) { if (!authed) return; }
  authed = true;
  hideLogin();
  document.getElementById('dashboard').style.display = '';
  await refreshAll();
  setInterval(refreshAll, 3000);
}

// 登录按钮
document.getElementById('login-btn').addEventListener('click', async () => {
  const token = document.getElementById('token-input').value;
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token }),
    });
    if (!res.ok) throw new Error('token 错误');
    location.reload();
  } catch (e) {
    document.getElementById('login-err').textContent = '令牌错误，请重试';
  }
});
document.getElementById('token-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('login-btn').click();
});

// 系统工具：内存释放 / Tailscale 连接
document.getElementById('memfree-btn').addEventListener('click', async () => {
  const btn = document.getElementById('memfree-btn');
  btn.disabled = true;
  cmdLog('🧹 释放内存 ...');
  try {
    const r = await api('/api/system/memfree', { method: 'POST' });
    const msg = document.getElementById('memfree-msg');
    msg.style.display = '';
    msg.innerHTML = '<span class="meta">已释放 ' + r.freed_gb + ' G 可用内存（' + r.processes + ' 个进程）</span>';
    cmdLog('✅ 内存释放完成: 可用 +' + r.freed_gb + ' G');
  } catch (e) { cmdLog('[错误] ' + e.message, 'err'); }
  btn.disabled = false;
  refreshTools();
});
document.getElementById('ts-up').addEventListener('click', () => doTailscale());

init();
</script>
