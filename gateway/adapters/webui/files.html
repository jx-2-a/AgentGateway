<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>文件管理</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --border: #30363d;
    --text: #c9d1d9; --dim: #8b949e; --accent: #58a6ff;
    --green: #3fb950; --red: #f85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 14px;
    display: flex; flex-direction: column; overscroll-behavior: none;
  }

  /* ---- 顶栏 ---- */
  #topbar {
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    padding: calc(6px + env(safe-area-inset-top)) 10px 6px;
    background: var(--card); border-bottom: 1px solid var(--border);
  }
  .home-btn { padding: 4px 12px; border-radius: 999px; font-size: 12px; text-decoration: none;
    background: rgba(88,166,255,.12); color: var(--accent);
    border: 1px solid rgba(88,166,255,.35); white-space: nowrap; flex-shrink: 0; }
  .sel { background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 8px; font-size: 13px; max-width: 150px; }
  #topbar .spacer { flex: 1; }
  #upload-btn { padding: 6px 14px; border: none; border-radius: 8px;
    background: var(--accent); color: #0d1117; font-weight: 600; font-size: 13px;
    cursor: pointer; white-space: nowrap; flex-shrink: 0; }

  /* ---- 状态行 / 面包屑 ---- */
  #status { flex-shrink: 0; padding: 6px 12px; font-size: 12px; color: var(--dim);
    min-height: 24px; border-bottom: 1px dashed var(--border); }
  #status.ok { color: var(--green); }
  #status.err { color: var(--red); }
  #crumb { flex-shrink: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
    padding: 8px 12px; font-size: 12px; color: var(--dim); }
  .crumb-item { cursor: pointer; color: var(--accent); }
  .crumb-item:hover { text-decoration: underline; }

  /* ---- 文件列表（大触控区） ---- */
  #list { flex: 1; overflow-y: auto; padding: 6px; -webkit-overflow-scrolling: touch; }
  .fitem { display: flex; align-items: center; gap: 10px; padding: 13px 10px;
    border-radius: 8px; cursor: pointer; font-size: 14px; touch-action: manipulation; }
  .fitem:hover { background: rgba(255,255,255,.04); }
  .fitem .fico { font-size: 18px; flex-shrink: 0; }
  .fitem .fname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fitem .fmeta { color: var(--dim); font-size: 12px; white-space: nowrap; }
  .fitem .fdl { background: transparent; color: var(--accent); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer;
    flex-shrink: 0; touch-action: manipulation; }
  .fitem .fdl:hover { border-color: var(--accent); }
  .empty { color: var(--dim); text-align: center; padding: 40px; font-size: 13px; }

  /* ---- 预览 ---- */
  #preview { flex-shrink: 0; max-height: 42vh; overflow: auto; border-top: 1px solid var(--border);
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); display: none; }
  #preview.show { display: block; }
  #preview img { max-width: 100%; border-radius: 8px; }
  #preview pre { font-family: Consolas, monospace; font-size: 12px; white-space: pre-wrap;
    word-break: break-all; color: var(--text); }
  #preview .pdl { display: inline-block; margin-top: 8px; color: var(--accent); font-size: 13px; }
  #preview .phead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    font-size: 13px; color: var(--dim); }
  #preview .pclose { margin-left: auto; background: none; border: none; color: var(--dim);
    font-size: 16px; cursor: pointer; padding: 4px; }

  /* ---- 上传遮罩 ---- */
  #upload-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 100;
    display: none; align-items: center; justify-content: center; }
  #upload-overlay.show { display: flex; }
  .upload-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 24px 30px; text-align: center; max-width: 80vw; }
  .upload-box .bar { width: 220px; height: 8px; background: var(--bg); border-radius: 4px;
    overflow: hidden; margin: 14px auto 8px; }
  .upload-box .bar i { display: block; height: 100%; width: 0; background: var(--accent);
    transition: width .15s; }
  .upload-box .txt { font-size: 12px; color: var(--dim); word-break: break-all; }
</style>
</head>
<body>

<header id="topbar">
  <a href="/" class="home-btn">‹ 主页</a>
  <select id="agent-select" class="sel"></select>
  <select id="project-select" class="sel" style="display:none"></select>
  <span class="spacer"></span>
  <button id="upload-btn">上传</button>
  <input type="file" id="file-input" multiple hidden>
</header>

<div id="status">加载中...</div>
<div id="crumb"></div>
<div id="list"><div class="empty">加载中...</div></div>

<div id="preview">
  <div class="phead"><span id="pv-name"></span><button class="pclose" id="pv-close">✕</button></div>
  <div id="pv-body"></div>
</div>

<div id="upload-overlay">
  <div class="upload-box">
    <div id="uo-title">上传中...</div>
    <div class="bar"><i id="uo-bar"></i></div>
    <div class="txt" id="uo-txt"></div>
  </div>
</div>

<script>
// ============================================================================
// 文件管理页：大区域浏览 + 手机上传/下载（数据双向传输）
// 数据源：/api/agents/{key}/files 列表、/api/file 下载预览、/api/files/upload 上传
// ============================================================================
let agents = [];
let agentKey = new URLSearchParams(location.search).get('agent') || '';
let project = '';
let path = '';

function esc(s) { return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function escAttr(s) { return String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cap(s) { s = String(s); return s.charAt(0).toUpperCase() + s.slice(1); }
function fmtSize(n) {
  if (n == null) return '';
  if (n < 1024) return n + 'B';
  if (n < 1048576) return (n/1024).toFixed(1) + 'K';
  if (n < 1073741824) return (n/1048576).toFixed(1) + 'M';
  return (n/1073741824).toFixed(1) + 'G';
}

async function api(url, opts = {}) {
  const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (res.status === 401) { location.href = '/'; throw new Error('unauthorized'); }
  if (!res.ok) { let d = res.statusText; try { d = (await res.json()).detail; } catch (e) {} throw new Error(d); }
  return res.json();
}

const statusEl = document.getElementById('status');
function setStatus(msg, cls) { statusEl.textContent = msg; statusEl.className = cls || ''; }

function fileUrl(p, dl) {
  const u = new URL('/api/file', location.href);
  u.searchParams.set('agent', agentKey);
  u.searchParams.set('path', p || '');
  u.searchParams.set('project', project);
  if (dl) u.searchParams.set('dl', '1');
  return u.href;
}

// ---- Agent / 项目选择 ----
async function loadAgents() {
  try { agents = await api('/api/agents'); }
  catch (e) { setStatus('加载失败: ' + e.message, 'err'); return; }
  const sel = document.getElementById('agent-select');
  sel.innerHTML = agents.map(a =>
    `<option value="${escAttr(a.key)}">${esc(cap(a.key))}</option>`).join('');
  if (agentKey && agents.some(a => a.key === agentKey)) sel.value = agentKey;
  else agentKey = sel.value || '';
  document.title = cap(agentKey) + ' — 文件';
  onAgentChange();
}

function currentAgent() { return agents.find(a => a.key === agentKey) || null; }

function onAgentChange() {
  const a = currentAgent();
  if (!a) { setStatus('Agent 不存在', 'err'); return; }
  agentKey = a.key;
  project = a.default_project || '';
  path = '';
  document.title = cap(a.key) + ' — 文件';
  const ps = document.getElementById('project-select');
  if (a.projects && a.projects.length > 1) {
    ps.style.display = '';
    ps.innerHTML = a.projects.map(p =>
      `<option value="${escAttr(p)}" ${p === project ? 'selected' : ''}>${esc(p)}</option>`).join('');
  } else {
    ps.style.display = 'none';
  }
  loadFiles('');
}

// ---- 列表 ----
const IMG_EXTS = ['png','jpg','jpeg','gif','webp','svg','bmp'];
const TXT_EXTS = ['txt','csv','log','md','json','yaml','yml','py','toml','cfg','ini','xml','html','js'];

async function loadFiles(p) {
  path = p;
  setStatus('加载中...');
  // 根目录不是可写目录，先进文件夹才能上传
  const upBtn = document.getElementById('upload-btn');
  if (!path) { upBtn.disabled = true; upBtn.title = '先进入文件夹再上传'; }
  else { upBtn.disabled = false; upBtn.title = ''; }
  const q = new URLSearchParams({ path: p || '', project });
  let data;
  try { data = await api('/api/agents/' + encodeURIComponent(agentKey) + '/files?' + q.toString()); }
  catch (e) {
    setStatus(e.message.indexOf('未配置') >= 0 ? '该 Agent 未配置文件目录' : '加载失败: ' + e.message, 'err');
    document.getElementById('crumb').innerHTML = '';
    document.getElementById('list').innerHTML = '<div class="empty">该 Agent 未配置文件目录</div>';
    return;
  }
  setStatus(project ? (agentKey + ' · ' + project) : agentKey);
  renderCrumb(data.path, data.parent);
  hidePreview();
  const list = document.getElementById('list');
  if (!data.items.length) { list.innerHTML = '<div class="empty">空目录</div>'; return; }
  list.innerHTML = data.items.map(it => {
    const isDir = it.type === 'dir';
    const dl = isDir ? '' :
      `<button class="fdl" onclick="event.stopPropagation(); downloadFile('${escAttr(it.path)}')">下载</button>`;
    return `<div class="fitem" data-type="${it.type}" data-path="${escAttr(it.path)}">
      <span class="fico">${isDir ? '📁' : '📄'}</span>
      <span class="fname">${esc(it.name)}</span>
      <span class="fmeta">${isDir ? '' : fmtSize(it.size)}</span>${dl}
    </div>`;
  }).join('');
}

function renderCrumb(p) {
  const crumb = document.getElementById('crumb');
  const parts = p ? p.split('/') : [];
  let html = '<span class="crumb-item" onclick="loadFiles(\'\')">根目录</span>';
  let acc = '';
  parts.forEach(seg => {
    acc = acc ? acc + '/' + seg : seg;
    html += ' <span>/</span> <span class="crumb-item" onclick="loadFiles(\'' + escAttr(acc) + '\')">' + esc(seg) + '</span>';
  });
  crumb.innerHTML = html;
}

document.getElementById('list').addEventListener('click', ev => {
  const el = ev.target.closest('.fitem');
  if (!el) return;
  const p = el.dataset.path;
  if (el.dataset.type === 'dir') loadFiles(p);
  else previewFile(p);
});

// ---- 下载 ----
function downloadFile(p) { window.open(fileUrl(p, true), '_blank'); }

// ---- 预览 ----
function hidePreview() {
  document.getElementById('preview').classList.remove('show');
  document.getElementById('pv-body').innerHTML = '';
}

async function previewFile(p) {
  const prev = document.getElementById('preview');
  const body = document.getElementById('pv-body');
  document.getElementById('pv-name').textContent = p.split('/').pop() || p;
  prev.classList.add('show');
  body.innerHTML = '<p style="color:#8b949e">加载中...</p>';
  const ext = (p.split('.').pop() || '').toLowerCase();
  if (IMG_EXTS.includes(ext)) {
    body.innerHTML = '<img src="' + escAttr(fileUrl(p)) + '" alt="preview"><br>' +
      '<a class="pdl" href="' + escAttr(fileUrl(p, true)) + '">下载原图</a>';
    return;
  }
  if (TXT_EXTS.includes(ext)) {
    try {
      const res = await fetch(fileUrl(p));
      const text = await res.text();
      body.innerHTML = '<pre>' + esc(text.slice(0, 50000)) +
        (text.length > 50000 ? '\n…(已截断)' : '') + '</pre>';
    } catch (e) { body.innerHTML = '<p style="color:#f85149">读取失败: ' + esc(e.message) + '</p>'; }
    return;
  }
  body.innerHTML = '<p style="color:#8b949e">无法内联预览</p>' +
    '<a class="pdl" href="' + escAttr(fileUrl(p, true)) + '">下载文件</a>';
}

document.getElementById('pv-close').addEventListener('click', hidePreview);

// ---- 上传（手机→电脑） ----
const fileInput = document.getElementById('file-input');
document.getElementById('upload-btn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async () => {
  const files = [...fileInput.files];
  fileInput.value = '';
  if (!files.length) return;
  const overlay = document.getElementById('upload-overlay');
  const bar = document.getElementById('uo-bar');
  const txt = document.getElementById('uo-txt');
  document.getElementById('uo-title').textContent = '上传 ' + files.length + ' 个文件到 ' + (path || '根目录');
  overlay.classList.add('show');
  let done = 0, ok = 0;
  for (const f of files) {
    const fd = new FormData();
    fd.append('agent', agentKey);
    fd.append('project', project);
    fd.append('path', path);
    fd.append('file', f, f.name);
    txt.textContent = f.name;
    try {
      const res = await fetch('/api/files/upload', { method: 'POST', body: fd });
      if (res.ok) ok++;
      else { let d = res.statusText; try { d = (await res.json()).detail; } catch (e) {} txt.textContent = '失败: ' + f.name + ' — ' + d; }
    } catch (e) { txt.textContent = '失败: ' + f.name + ' — ' + e.message; }
    done++;
    bar.style.width = Math.round(done / files.length * 100) + '%';
  }
  await new Promise(r => setTimeout(r, 400));
  overlay.classList.remove('show');
  bar.style.width = '0';
  setStatus(ok === files.length ? '✅ 全部上传成功 (' + ok + ')' : '⚠ 上传完成: ' + ok + '/' + files.length,
    ok === files.length ? 'ok' : 'err');
  loadFiles(path);
});

document.getElementById('project-select').addEventListener('change', e => {
  project = e.target.value;
  loadFiles('');
});

document.getElementById('agent-select').addEventListener('change', onAgentChange);

loadAgents();
</script>
</body>
</html>
